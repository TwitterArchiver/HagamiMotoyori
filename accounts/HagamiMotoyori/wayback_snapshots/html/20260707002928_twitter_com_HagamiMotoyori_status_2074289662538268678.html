  Bisphenol A（双酚A，简称 BPA）是一种广泛使用的工业化学品，主要用于生产聚碳酸酯塑料和环氧树脂。
  <br/>
  常见用途
  <br/>
  透明塑料制品（部分水杯、食品容器等）
  <br/>

  <br/>

  <br/>

  <br/>
  生殖和发育影响
  <br/>
  内分泌系统变化
  <br/>
  婴幼儿发育风险增加
